[package]
name = "ob-widget"
version = "0.1.0"
description = "Obsidian Live Widget"
authors = ["Uves"]
edition = "2021"

[lib]
name = "ob_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
window-vibrancy = "0.6"
